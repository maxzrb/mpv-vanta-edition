# 指定脚本的工作方式，有三种模式可选：noth、pass、switch。默认值：noth
## noth：什么也不做
## pass：当显示器处于 HDR 模式时，为 HDR 内容传递 HDR 信号
## switch：根据 mpv 播放的视频内容在显示器的 HDR 模式和 SDR 模式之间自动切换，在 Windows 10 及更高版本的系统上可用
#! pass 模式只建议在 mpv v0.41.0 之前的版本使用，后续版本的 mpv 默认参数已支持 HDR 直通
hdr_mode=noth
# 指定是否仅在全屏或窗口最大化时自动切换 HDR 模式。仅在 hdr_mode=switch 时生效，默认值：no
fullscreen_only=no
# 用于指定 HDR 显示器的目标峰值，默认值：0
# 默认使用 display-info.dll 提供的 user-data/display-info/max-luminance 自动检测值
# 也可以填写具体数值覆盖自动检测
#! 提醒：自定义时必须填写显示器的真实峰值亮度，否则会导致 HDR 内容显示不正确
# 旧参数保留兼容；统一目标改用 script-opts/color-target.conf 的 hdr_peak。
target_peak=0
# 用于指定 HDR 显示器的最大对比度，默认值：auto
# 默认尝试通过 display-info.dll 的 user-data/display-info/min-luminance 计算正确值
#! 提醒：自定义时必须填写显示器的真实最大对比度，否则无法正确实施黑位补偿
## 例如 100000 表示显示器最大对比度为 100000:1
## OLED 显示器可以填写特殊值 inf 表示无限对比度
# 旧参数保留兼容；统一目标改用 color-target.conf 的 hdr_contrast。
target_contrast=auto
