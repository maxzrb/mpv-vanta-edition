# HDR 为待实机验收的独立路线，不自动开启 Windows HDR。
hdr_backend=scrgb
verify_timeout=3
# 0 表示采用当前显示器系统报告；仅填写可信实测／校准峰值。
hdr_peak=0
hdr_contrast=auto
# auto 在 scRGB 中保留零黑位，避免用驱动黑位报告改写绝对亮度；显式数值仍可覆盖。
# 首次使用默认标准模式；菜单选择按主模式单独保存，与显示器 ICC／峰值偏好分离。
pipeline=standard
# HQ 使用系统协商的参考白与片源 HDR 元数据，默认关闭逐帧场景峰值分析。
# SDR ACM 的参考白是工作空间尺度，不等于面板实测峰值；不要按驱动标称峰值改写。
# 有效系统 SDR 参考白优先；无法取得或数值无效时，才回退到名义 80 nits。
