# options to pass to wget
## 设置 mpv 需全局记忆的选项状态
## 自用改版：不跨启动恢复 GLSL 着色器，避免普通视频起播时自动增加显卡负载
## 仅加入跨视频、跨启动仍有意义的用户偏好；单文件状态和 profile 临时状态不放在这里
properties=volume,audio-device,title-bar,sub-font,sub-ass-override,sub-ass-style-overrides,sub-ass-use-video-data,sub-ass-force-margins,sub-use-margins
## 保存文件路径
properties_path=files/persistent_config.json
