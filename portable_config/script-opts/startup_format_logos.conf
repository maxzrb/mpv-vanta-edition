# 是否启用起播专业格式 Logo
enabled=yes
# 黑边检测模式：current=后瞻单路(低峰值) / parallel=后瞻双路并发(更快) /
# yaozhi=杳知视觉方案(纯视觉，显示后可重定位) / none=不检测(右上角直接显示)
mode=current
# 图标样式：color 为彩色徽章，white 为透明背景白色图标
style=white
# 是否显示画面标准 Logo
show_video=yes
# 是否显示音频标准 Logo
show_audio=yes
# 是否为普通 SDR 画面显示彩色 SDR 徽章
show_sdr=yes
# 是否显示 FLAC、PCM、AAC、Opus、MP3 等常见音频格式徽章
show_common_audio=yes
# 是否只在存在真实视频轨时显示；设为 no 时纯音频与带封面的音频会显示音频格式徽章，封面不会触发 SDR
require_video=no
# 是否允许从文件名、媒体标题和路径补充识别；音频仅限单音轨且与当前 codec 家族兼容，避免多音轨 Dolby/DTS 串标
filename_fallback=yes
# 切换音轨后是否短暂显示新的音频格式 Logo
show_on_audio_change=yes
# 显示位置：top-right、top-left、bottom-right、bottom-left
position=top-right
# 是否以实际视频画面边界为定位基准；有上下/左右黑边时让徽章进入画面安全区
anchor_to_video=yes
# 是否在首帧后抽样识别编码进视频帧的黑边（常见于蓝光 ISO），只用于徽章定位，不裁视频
detect_encoded_bars=yes
# 编码黑边的 RGB 黑色阈值（0-48）；数值越高越容易识别较浅的黑边
encoded_bar_threshold=16
# 首帧后等待画面稳定再抽样编码黑边的时间，单位为秒
encoded_bar_delay=0.18
# 抽样检测黑边的帧数（1-5）；多帧结果取中位数合并，避免全黑首帧、片头渐变和瞬时画面误判
encoded_bar_samples=3
# 画面内容覆盖率低于该值时（偏黑/稀疏场景）不采用黑边锚点，避免暗部内容被误判成黑边、徽标被乱推
encoded_bar_min_coverage=0.3
# 后瞻：起播黑屏/稀疏画面时，在 encoded_bar_lookahead_min ~ encoded_bar_lookahead 秒窗口内随机采样
# encoded_bar_lookahead_samples 处（第一处落在下限~下限+1s，任意两处间隔 >= encoded_bar_lookahead_gap 秒），
# 并行解码对应帧，任一帧可信即用，避免单点恰好踩空进黑屏；0=关闭，找不到 ffmpeg 自动回退复检
encoded_bar_lookahead=10
encoded_bar_lookahead_min=3
encoded_bar_lookahead_samples=3
encoded_bar_lookahead_gap=2
# 单路按 3~10 秒近端与 30~75 秒深确认窗交错采样；双路优先同时检测
# 两个不同区段的深后瞻帧，避开常见的发行方黑屏/字幕并尽快形成共识。
# confirm_lookahead <= encoded_bar_lookahead 可关闭第二确认窗。
encoded_bar_confirm_min=30
encoded_bar_confirm_lookahead=75
encoded_bar_confirm_samples=3
# 两种后瞻模式都优先检测 40 秒处：通常已跨过发行方片头，并兼顾 AV1/HEVC
# seek 开销。偏重 AV1 可尝试 60；该帧仍不可信时才按单路/双路进入补测。
encoded_bar_fast_probe=40
# 每个后瞻 ffmpeg 的解码线程数。单路模式最多一个进程，双路并发模式最多两个；
# 0=由 ffmpeg 自动决定（更快但峰值更高）。
encoded_bar_ffmpeg_threads=4
# 相邻抽样帧的间隔时间，单位为秒
encoded_bar_sample_interval=0.22
# 全黑开场/片头 Logo 等稀疏画面（覆盖率低于 28%）时的首次复检延迟，单位为秒；
# 复检期间徽标暂不显示，确认黑边/内容画面后一次性显示并冻结锚点，不暂停、不延迟起播；
# 杳知 8.14 起：真实黑边需至少两次一致采样确认，无黑边也需两次内容充分共识，
# 本次文件内只锁定一次位置，后续检测不能再让徽章飘动
encoded_bar_followup_delay=2.5
# 稀疏开场复检的间隔时间，单位为秒
encoded_bar_followup_interval=1.5
# 稀疏开场复检的最大次数（0-5）；出现多次一致的可信内容画面即提前结束，次数耗尽后兜底显示
encoded_bar_followup_samples=3
# Logo 卡片整体缩放倍率；横屏以 1920×1080、竖屏以 1080×1920 为基准自动适配
scale=1.0
# 竖屏徽章额外倍率；仅放大徽章本身，不改变安全边距和横屏效果
portrait_scale=1.18
# 随横屏或竖屏基准自动缩放的水平安全边距
margin_x=60
# 随横屏或竖屏基准自动缩放的垂直安全边距
margin_y=38
# 首帧与画面边界就绪后，继续等待再检测和显示的时间，单位为秒
delay=0.45
# 完全点亮后的停留时间，单位为秒
hold=4.0
# 等待首帧事件的最长时间；超时后仅在视频输出尺寸已经有效时兜底显示
frame_wait_timeout=5.0
# 淡入时间，单位为秒；设为 0 可关闭淡入
fade_in=0.12
# 淡出时间，单位为秒；设为 0 可关闭淡出
fade_out=0.18
# 首次没有取得完整轨道信息时的重试间隔，单位为秒
retry_interval=0.25
# 最大检测次数
retry_count=8
# 画面标准优先级，使用英文逗号分隔
video_priority=dolby-vision,hdr-vivid,hdr10-plus,hdr10,hlg,sdr
# 音频标准优先级，使用英文逗号分隔
audio_priority=dolby-atmos,dts-x,audio-vivid,dolby-truehd,dts-hd-ma,dts-hd-hra,dolby-digital-plus,dolby-digital,dts,ac4,mpeg-h,flac,alac,pcm,mlp,wavpack,ape,wma,opus,aac,vorbis,mp3
# 运行素材目录
asset_dir=~~/script-assets/startup-format-logos/runtime
# 占用连续三个 overlay ID；默认 50、51、52，避免与 thumbfast 的 42 冲突
overlay_id=50
