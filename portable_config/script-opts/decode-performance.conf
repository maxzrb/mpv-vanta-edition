# 高分辨率 AV1 软解并行优化；不修改滤镜、色彩、源格式或同步策略。
enabled=yes
max_threads=32
max_frame_delay=32
# 解码资源估算上限（MiB）；还会受总内存和当前可用内存约束。
max_memory_mib=8192
# 仅对至少 3840×2160 像素的 AV1 生效。
min_pixels=8294400
# 用户开启后，通用软解过载追赶可省略部分非参考画面；硬解与时域滤镜保持原策略。
# 只保存开关，临时 nonref 模式不跨文件／启动保存；安全重载可能短暂停顿。
catchup=no
catchup_enter_lag=0.35
catchup_enter_hold=1.5
catchup_leave_lag=0.06
catchup_leave_hold=8
catchup_minimum=12
# 默认本片保持参考帧模式；关闭追赶、换片或选择硬解时恢复完整解码。
# 可选自动恢复：低延迟不是全帧解码余量证明，开启后可能再次过载及重建停顿。
catchup_recover=no
# 仅自动恢复开启时，失败后指数延长重试间隔。
catchup_retry=30
catchup_settle=2
# 全帧模式持续掉帧也触发追赶：窗口至少三帧且占源帧率的 5%。
catchup_drop_window=2
catchup_drop_ratio=0.05
# 参考帧模式仍持续落后时限频重新定位，不反复切换解码模式。
catchup_sync_lag=0.75
catchup_sync_hold=2
catchup_sync_interval=10
