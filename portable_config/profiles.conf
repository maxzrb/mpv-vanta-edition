##############
# 常规配置组 #
##############

##⇘⇘常规配置没有自动触发条件（内置配置组也全为常规配置）
##需要主设置文件中使用 --profile=<profile1,profile2,...> 或多行 --profile=<xxx> 参数激活数个配置

[ICC]
 icc-profile=""
 icc-profile-auto
 icc-intent=0
 icc-force-contrast=no
 icc-3dlut-size=auto
 icc-cache-dir="~~/cache/icc_cache"

[ICC+]
 icc-profile="~~/icc/ITU-RBT709ReferenceDisplay.icc"
 icc-intent=0
 icc-force-contrast=no
 icc-3dlut-size=auto
 icc-cache-dir="~~/cache/icc_cache"

[Target]
 # 本机默认：显示器 sRGB 模式，Windows HDR 关闭。
 icc-profile=""
 icc-profile-auto=no
 target-prim=bt.709
 target-trc=srgb
 treat-srgb-as-power22=no
 target-contrast=auto
 target-colorspace-hint=no
 d3d11-output-csp=srgb
 d3d11-output-format=auto

[Color-SDR]
 profile-restore=copy
 profile=Target

# 格式和色彩空间同时应用，避免逐项修改时重建出不兼容的交换链。
[Color-Output-SDR]
 d3d11-output-format=auto
 d3d11-output-csp=srgb

[Color-Output-scRGB]
 d3d11-output-format=rgba16f
 d3d11-output-csp=linear

[Color-Output-PQ]
 d3d11-output-format=rgb10_a2
 d3d11-output-csp=pq

[Color-ICC]
 profile-restore=copy
 # 只在确认系统 ICC 对应当前显示器和显示模式时使用。
 profile=Target
 icc-profile-auto=yes
 icc-force-contrast=no
 icc-intent=1

[Color-HDR]
 profile-restore=copy
 # 高级手动预设，不负责能力检查；常规菜单必须通过 color-select。
 # 需要 Windows HDR 与 HDR 显示器，HDR 实机色准尚待验收。
 icc-profile=""
 icc-profile-auto=no
 target-prim=auto
 target-trc=auto
 target-colorspace-hint=yes
 d3d11-output-csp=auto
 d3d11-output-format=auto

[Dither]
 dither-depth=auto
 dither=fruit
 dither-size-fruit=6

[Dither+]
 dither-depth=auto
 dither=error-diffusion
 error-diffusion=floyd-steinberg

[Tscale]
 video-sync=display-resample
 #video-sync-max-video-change=5
 interpolation
 #interpolation-preserve=no
 tscale=oversample

[Tscale+]
 video-sync=display-resample
 #video-sync-max-video-change=5
 interpolation
 #interpolation-preserve=no
 tscale=sphinx
 tscale-blur=0.65

[HQ]
 scale=ewa_lanczossharp
 cscale=bilinear
 dscale=catmull_rom
 scale-antiring=0.5
 dscale-antiring=0.5
 linear-upscaling=no
 sigmoid-upscaling=yes
 correct-downscaling=yes
 linear-downscaling=yes
 #scaler-resizes-only=no
 deband=no

[Performance-Balanced]
 # 默认 HQ：线性缩小保持亮度平均；不改变去色带或补帧。
 scale=ewa_lanczossharp
 cscale=bilinear
 dscale=catmull_rom
 scale-antiring=0.5
 dscale-antiring=0.5
 linear-upscaling=no
 sigmoid-upscaling=yes
 correct-downscaling=yes
 linear-downscaling=yes

[Performance-HighQuality]
 # 可选高质量：更高质量色度重建，线性缩小与默认 HQ 一致。
 scale=ewa_lanczossharp
 cscale=spline36
 dscale=catmull_rom
 scale-antiring=0.5
 dscale-antiring=0.5
 linear-upscaling=no
 sigmoid-upscaling=yes
 correct-downscaling=yes
 linear-downscaling=yes

[DeBand-low]
 profile-desc=DeBand low
 deband-iterations=1
 deband-threshold=48
 deband-range=16
 deband-grain=16

[DeBand-medium]
 profile-desc=deband medium
 deband-iterations=2
 deband-threshold=64
 deband-range=16
 deband-grain=24

[DeBand-high]
 profile-desc=deband high
 deband-iterations=3
 deband-threshold=64
 deband-range=16
 deband-grain=24

[HDR2SDR]
 profile-desc=HDR-SDR 映射参数
 tone-mapping=auto
 #tone-mapping-param=1.0
 #tone-mapping-max-boost=1.0
 gamut-mapping-mode=auto
 # 准确基线不叠加局部对比度恢复；观感增强由用户单独选择。
 hdr-contrast-recovery=0
 #hdr-contrast-smoothness=3.5
 hdr-compute-peak=auto
 hdr-peak-percentile=99.995
 hdr-peak-decay-rate=20
 hdr-scene-threshold-low=1.0
 hdr-scene-threshold-high=3.0
 allow-delayed-peak-detect=no

[HDR-Contrast-Optional]
 profile-desc=手动观感增强：局部对比度恢复（非准确播放基线）
 hdr-contrast-recovery=0.30

[SDR2HDR]
 profile-desc=SDR 反向映射 HDR 参数
 icc-profile=""
 icc-profile-auto=no
 target-prim=auto
 #target-gamut=dci-p3   # 或 adobe，用于 argb 色域
 target-trc=auto
 target-peak=auto  # --gpu-api=vulkan 下必须指定显示器的峰值亮度值，--gpu-api=d3d11 下默认值会自动获取此信息
 target-colorspace-hint=auto
 inverse-tone-mapping=yes

##⇘⇘备选的软件缩放方案
##在 mpv 内部需要执行格式转换时会用到软件缩放器
[SWscaler]
 profile-desc=软件缩放配置
 sws-allow-zimg=no                  # 优先使用 zimg（通常具有更高质量）而不是 libswscale，默认 yes。ffmpeg 经常出现和 zimg 间的兼容性问题，建议禁用
 sws-scaler=bicublin                # [libswscale] <fast-bilinear|bilinear|bicubic 默认|x|point|area|bicublin|gauss|sinc|lanczos|spline>
                                    # [libswscale] 缩放算法（同时作用于色度平面）
 #sws-fast=yes                      # [libswscale] 以质量为代价优化性能，默认 no
 zimg-scaler-chroma=bicubic         # [zimg] <point|bilinear|bicubic|spline16|spline36|lanczos 默认>
                                    # [zimg] 色度还原算法
 #zimg-scaler-chroma-param-a=1/3    # [zimg] 色度还原算法的子参数，不支持调节的算法不受影响，默认 default
 #zimg-scaler-chroma-param-b=1/3
 zimg-scaler=bicubic                # [zimg] 缩放算法，可用值参考 --zimg-scaler-chroma
 zimg-scaler-param-a=1/3            # [zimg] 缩放算法的子参数
 zimg-scaler-param-b=1/3
 #zimg-dither=error-diffusion       # [zimg] <no|ordered|random 默认|error-diffusion> 色深抖动算法
 zimg-fast=no                       # [zimg] 以质量为代价优化性能，默认 yes


