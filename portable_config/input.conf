# 此文件定义 mpv 的快捷键绑定和 uosc 右键菜单项目

o                script-message-to uosc open-file

## Anime4K v4 官方标准预设；A／B／C 优先按画面观感选择，A+A／B+B／C+A 仅建议至少 2× 放大时使用

## 日常按用途查找；同一文件在下方专家库按原算法家族再次索引，着色器文件本身不会复制

## 完整保留原有算法家族路径，便于按 AMD、Anime4K、FSRCNNX 等技术名称查找

Q                quit-watch-later                                                                                       # 退出并保存当前状态

MENU             script-message-to uosc menu-blurred                                       # 开/关 uosc 菜单
POWER            quit
PLAY             cycle pause;script-message-to uosc flash-pause-indicator
PAUSE            cycle pause;script-message-to uosc flash-pause-indicator
PLAYPAUSE        cycle pause;script-message-to uosc flash-pause-indicator
STOP             quit
FORWARD          seek  30
REWIND           seek -30
NEXT             playlist-next
PREV             playlist-prev


MBTN_LEFT        cycle pause;script-message-to uosc flash-pause-indicator
MBTN_LEFT_DBL    ignore
MBTN_Right       script-message-to uosc menu-blurred                                    # 打开 uosc 菜单（默认）
SHIFT+MBTN_Right script-message-to context_menu open                                    # 打开 menu 菜单（OSD 版）
MBTN_MID         context-menu                                                           # 打开 menu 菜单（GUI 版）
MBTN_FORWARD     playlist-next;show-text "播放列表:${playlist-pos-1}/${playlist-count}" # 前进键 切换到列表中的下个文件
MBTN_BACK        playlist-prev;show-text "播放列表:${playlist-pos-1}/${playlist-count}" # 后退键 切换到列表中的上个文件
MBTN_Right_DBL   ignore
#MBTN_MID        ignore
Wheel_Up         no-osd add volume  1; script-message-to uosc flash-volume
Wheel_Down       no-osd add volume -1; script-message-to uosc flash-volume
#WHEEL_LEFT      ignore
#WHEEL_RIGHT     ignore
ESC              set fullscreen no;set window-maximized no

9                no-osd add volume -1; script-message-to uosc flash-volume  # 音量 -1
0                no-osd add volume  1; script-message-to uosc flash-volume  # 音量 +1

## 菜单：打开
CTRL+o           script-message-to open_dialog import_files                                                             #menu: 打开 > 打开文件…
TAB              script-message-to file_browser browse-files;script-message-to file_browser dynamic/reload;show-text '' #menu: 打开 > 文件浏览器



#                script-message-to uosc open-file                                                                        #! 打开 > 内置文件浏览器
CTRL+v           script-message-to smartcopypaste_II paste                                                              #menu: 打开 > 从剪贴板打开
CTRL+ALT+v       script-message-to smartcopypaste_II paste-specific                                                     #menu: 打开 > 追加剪贴板到播放列表
#                ignore #menu: 打开 > ---
#                script-binding recentmenu/open                                                                         #menu: 打开 > 最近播放 #@recent
CTRL+l           script-message-to simplehistory history-resume                                                         #menu: 打开 > 继续上次播放
`                script-message-to simplehistory open-list;show-text ''                                                 #menu: 打开 > 播放历史 > 查看全部历史
ALT+l            script-message-to simplehistory history-incognito-mode                                                 #menu: 打开 > 播放历史 > 无痕播放
CTRL+L           script-message-to simplehistory history-load-last                                                      #menu: 打开 > 播放历史 > 打开上次文件
ALT+C            script-message-to smartcopypaste_II open-list;show-text ''                                             #menu: 打开 > 剪贴板历史
