SHIFT+UP         seek  80 exact                                                                                         #menu: 导航 > 跳转 > 精准前进 80 秒
F3               script-message-to chapterskip skip-to-silence;show-text "跳到下一个静音位置"                           #menu: 导航 > 跳转 > 下一个静音点
#                ignore                                                                                                 #menu: 导航 > 章节 > 章节列表 #@chapters
#                script-message-to uosc chapters                                                                        #! 导航 > 章节 > 章节列表
PGDWN            add chapter -1                                                                                         #menu: 导航 > 章节 > 上一章节
PGUP             add chapter  1                                                                                         #menu: 导航 > 章节 > 下一章节
#                ignore #menu: 导航 > 章节 > ---
ALT+q            script-message-to chapterskip chapter-skip                                                             #menu: 导航 > 章节 > 自动跳过片头片尾
ALT+n            script-message-to chapterskip toggle-markskip                                                          #menu: 导航 > 章节 > 标记片头片尾
N                script-message-to simplebookmark open-list;show-text ''                                                #menu: 导航 > 书签 > 查看书签
CTRL+n           script-message-to simplebookmark bookmark-save                                                         #menu: 导航 > 书签 > 保存当前位置
CTRL+N           script-message-to simplebookmark bookmark-fileonly                                                     #menu: 导航 > 书签 > 收藏当前文件
#                ignore #menu: 导航 > ---
[                no-osd add      speed -0.1; script-message-to uosc flash-speed                                         #menu: 导航 > 播放速度 > 减速 0.1 倍
]                no-osd add      speed  0.1; script-message-to uosc flash-speed                                         #menu: 导航 > 播放速度 > 加速 0.1 倍
BS               no-osd set      speed  1.0; script-message-to uosc flash-speed                                         #menu: 导航 > 播放速度 > 恢复正常速度
#                ignore #menu: 导航 > 播放速度 > ---
{                no-osd multiply speed  0.5; script-message-to uosc flash-speed                                         #menu: 导航 > 播放速度 > 半速
}                no-osd multiply speed  2.0; script-message-to uosc flash-speed                                         #menu: 导航 > 播放速度 > 倍速
L                cycle-values loop-file inf no;show-text "循环播放:${loop-file}"                                        #menu: 导航 > 循环播放 > 单集循环 #@state=(loop_file and 'checked')
l                ab-loop                                                                                                #menu: 导航 > 循环播放 > 设置／清除片段循环
n                script-message playlistmanager shuffle                                                                 #menu: 导航 > 打乱播放列表

