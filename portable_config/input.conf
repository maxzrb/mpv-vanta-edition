#                script-message-to webtorrent toggle-info;show-text ''                                                  #menu: 打开 > 网络视频 > 磁链信息
CTRL+F           script-message-to quality_menu video_formats_toggle                                                    #menu: 打开 > 网络视频 > 选择视频清晰度
ALT+F            script-message-to quality_menu audio_formats_toggle                                                    #menu: 打开 > 网络视频 > 选择音频格式
