SHIFT+LEFT       seek -1 exact                                                                                          #menu: 导航 > 跳转 > 精准后退 1 秒
SHIFT+RIGHT      seek  1 exact                                                                                          #menu: 导航 > 跳转 > 精准前进 1 秒
